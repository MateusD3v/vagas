name: Scheduled worker trigger

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected worker cycle
        env:
          VAGAS_API_URL: ${{ secrets.VAGAS_API_URL }}
          VAGAS_ADMIN_API_KEY: ${{ secrets.VAGAS_ADMIN_API_KEY }}
        run: |
          if [ -z "$VAGAS_API_URL" ] || [ -z "$VAGAS_ADMIN_API_KEY" ]; then
            echo "VAGAS_API_URL/VAGAS_ADMIN_API_KEY not configured; skipping."
            exit 0
          fi

          curl --fail --show-error --silent             --retry 3             --retry-delay 10             --max-time 120             -X POST "${VAGAS_API_URL%/}/worker/run-once"             -H "X-Admin-Key: $VAGAS_ADMIN_API_KEY"             -H "Content-Type: application/json"             -d '{}'
