name: Inspect Breezy public JobPosting

on:
  push:
    branches:
      - inspect-search-profile-20261005

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read structured public Breezy data
        shell: bash
        run: |
          set -euo pipefail
          url='https://unio-digital.breezy.hr/p/e03e9b1c94de-tier-iii-service-desk-engineer'
          curl --fail --show-error --silent --location \
            --connect-timeout 20 --max-time 120 \
            --header 'User-Agent: Mozilla/5.0' \
            "$url" -o /tmp/breezy.html
          python - <<'PY'
          from pathlib import Path
          import json, re
          html = Path('/tmp/breezy.html').read_text(errors='ignore')
          for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', html, re.I|re.S):
              try:
                  data = json.loads(m.group(1))
              except Exception:
                  continue
              if data.get('@type') != 'JobPosting':
                  continue
              print(json.dumps({
                  'keys': sorted(data.keys()),
                  'title': data.get('title'),
                  'identifier': data.get('identifier'),
                  'datePosted': data.get('datePosted'),
                  'validThrough': data.get('validThrough'),
                  'employmentType': data.get('employmentType'),
                  'hiringOrganization': data.get('hiringOrganization'),
                  'jobLocation': data.get('jobLocation'),
                  'applicantLocationRequirements': data.get('applicantLocationRequirements'),
                  'jobLocationType': data.get('jobLocationType'),
                  'baseSalary': data.get('baseSalary'),
                  'url': data.get('url'),
                  'descriptionLength': len(data.get('description') or ''),
              }, indent=2))
          PY
