name: Inspect Breezy public page

on:
  push:
    branches:
      - inspect-search-profile-20261005

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Breezy job markup
        shell: bash
        run: |
          set -euo pipefail
          url='https://unio-digital.breezy.hr/p/e03e9b1c94de-tier-iii-service-desk-engineer'
          curl --fail --show-error --silent --location \
            --connect-timeout 20 --max-time 120 \
            --header 'User-Agent: Mozilla/5.0' \
            "$url" -o /tmp/breezy.html
          echo "SIZE $(wc -c < /tmp/breezy.html)"
          echo "TITLE"
          grep -oEi '<title>[^<]+' /tmp/breezy.html | head -1 || true
          echo "META"
          grep -oEi '<meta[^>]+(og:title|og:description|description)[^>]*>' /tmp/breezy.html | head -12 || true
          echo "JSONLD"
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/breezy.html').read_text(errors='ignore')
          for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', html, re.I|re.S):
              print(m.group(1)[:4000])
          PY
          echo "FORM MARKERS"
          grep -oEi '(application_form|apply for this position|apply now|questionnaire|position_id|company_id)[^<]{0,160}' /tmp/breezy.html | head -30 || true
