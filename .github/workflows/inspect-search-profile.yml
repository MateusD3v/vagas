name: Inspect worker heartbeat

on:
  push:
    branches:
      - inspect-search-profile-20261005

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read worker heartbeat
        shell: bash
        env:
          VAGAS_API_URL: ${{ secrets.VAGAS_API_URL }}
          VAGAS_ADMIN_API_KEY: ${{ secrets.VAGAS_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          readonly api_url="${VAGAS_API_URL%/}"
          curl --fail --show-error --silent \
            --connect-timeout 20 \
            --max-time 120 \
            --header "X-Admin-Key: $VAGAS_ADMIN_API_KEY" \
            "$api_url/worker/status" \
            | jq '{status,lastSeenAt,metadata}'
