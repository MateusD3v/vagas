name: Format Diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/modules/applications/application-question-readiness.ts
      - run: git diff -- src/modules/applications/application-question-readiness.ts
