name: CI

on:
  push:
    branches: ['main', 'phase-*']
  pull_request:
    branches: ['main']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: |
          set -eu
          curl -fsSL 'https://himalayas.app/jobs/api/search?q=Node.js&sort=recent' -o /tmp/himalayas.json
          jq '{
            topLevelKeys: keys,
            jobsCount: (.jobs | length),
            fields: [
              .jobs[] | {
                title,
                companyName,
                companySlug,
                companyLogo,
                employmentType,
                minSalary,
                maxSalary,
                salaryPeriod,
                seniority,
                currency,
                locationRestrictions,
                timezoneRestrictions,
                timezoneRestriction,
                categories,
                category,
                parentCategories,
                pubDate,
                expiryDate,
                applicationLink,
                guid
              }
            ]
          }' /tmp/himalayas.json
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
