name: CI

on:
  push:
    branches: ['main', 'phase-*']
  pull_request:
    branches: ['main']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Preview Prettier diff
        run: |
          npx prettier --write src/integrations/job-sources/providers/solides/solides.adapter.ts tests/solides-job-source.test.ts
          git diff -- src/integrations/job-sources/providers/solides/solides.adapter.ts tests/solides-job-source.test.ts
          git diff --exit-code -- src/integrations/job-sources/providers/solides/solides.adapter.ts tests/solides-job-source.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
