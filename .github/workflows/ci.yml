name: CI

on:
  push:
    branches: ['main', 'phase-*']
  pull_request:
    branches: ['main']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Preview Brazil portals Prettier diff
        run: |
          npx prettier --write src/modules/sources/portal-search-plan.ts tests/application-channel.test.ts tests/portal-search-plan.test.ts
          git diff -- src/modules/sources/portal-search-plan.ts tests/application-channel.test.ts tests/portal-search-plan.test.ts
          git diff --exit-code -- src/modules/sources/portal-search-plan.ts tests/application-channel.test.ts tests/portal-search-plan.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
