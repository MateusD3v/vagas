name: SmartRecruiters Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Posting API
        run: |
          set -euo pipefail
          list_code=$(curl -sS -o /tmp/sr-list.json -w "%{http_code}" "https://api.smartrecruiters.com/v1/companies/smartrecruiters/postings?limit=1&destination=PUBLIC")
          echo "LIST_HTTP_STATUS=$list_code"
          posting_id=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/sr-list.json','utf8'));process.stdout.write(String(x.content?.[0]?.id||''))")
          echo "POSTING_ID=$posting_id"
          detail_code=$(curl -sS -o /tmp/sr-detail.json -w "%{http_code}" "https://api.smartrecruiters.com/v1/companies/smartrecruiters/postings/$posting_id")
          echo "DETAIL_HTTP_STATUS=$detail_code"
          head -c 1200 /tmp/sr-detail.json || true
          echo
